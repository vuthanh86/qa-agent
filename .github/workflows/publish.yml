name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger; the version guard below still applies

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the v<version> tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to know if v<version> is already cut

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # --if-present: no "test" script defined yet, so this is a no-op until one exists.
      - run: npm test --if-present

      - run: npm run build

      # Every push to main triggers this job, but npm rejects re-publishing an
      # existing version. Skip instead of failing when package.json wasn't bumped.
      - id: version
        name: Resolve version and check npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already on npm - skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $NAME@$VERSION"
          fi

      - name: Publish
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tag only after a successful publish, so a failed release leaves no tag behind.
      - name: Tag release
        if: steps.version.outputs.published == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists - nothing to tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
